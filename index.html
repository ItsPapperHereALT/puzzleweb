<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
  <style>
    body {
      background-color: black;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body>

<div id="puzzle-content">Loading...</div>
<footer>Made by Thomas :3</footer>

<script>
const API_URL = "https://api.tiohmaxzing.dev";
let currentToken = null;

function render(data) {
  document.title = data.title || "Puzzle";
  const container = document.getElementById("puzzle-content");
  container.innerHTML = data.html;

  const btn = document.getElementById("submitBtn");
  if (btn) {
    btn.addEventListener("click", submitAnswer);
  }
}

async function submitAnswer() {
  const input = document.getElementById("ans");
  const answer = input ? input.value : "";
  try {
    const res = await fetch(`${API_URL}/check`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: currentToken, answer }),
    });
    const data = await res.json();
    if (data.correct) {
      currentToken = data.token;
      sessionStorage.setItem("puzzleToken", currentToken);
      render(data);
    } else {
      alert("Wrong one. Try again.");
    }
  } catch (e) {
    alert("Something went wrong, try again.");
  }
}

async function init() {
  const savedToken = sessionStorage.getItem("puzzleToken");
  try {
    if (savedToken) {
      const res = await fetch(`${API_URL}/content`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: savedToken }),
      });
      const data = await res.json();
      if (!data.error) {
        currentToken = savedToken;
        render(data);
        return;
      }
    }
    const res = await fetch(`${API_URL}/start`, { method: "POST" });
    const data = await res.json();
    currentToken = data.token;
    sessionStorage.setItem("puzzleToken", currentToken);
    render(data);
  } catch (e) {
    document.getElementById("puzzle-content").innerText = "Failed to load puzzle. Refresh?";
  }
}

init();
</script>

</body>
</html>
